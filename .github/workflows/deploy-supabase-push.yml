name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/send-push-notification/**"
      - "supabase/functions/send-job-reminders/**"
      - "supabase/functions/contract-scheduling-assistant/**"
      - "supabase/functions/business-assistant/**"
      - "supabase/functions/customer-communications/**"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase-push.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the GitHub repository secret SUPABASE_ACCESS_TOKEN from Supabase Account Settings > Access Tokens."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Add the GitHub repository secret SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi

      - name: Configure reminder caller secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REMINDER_CRON_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          supabase secrets set "REMINDER_CRON_SECRET=$REMINDER_CRON_SECRET" --project-ref uxsndyiyqttnrdeanhli

      - name: Deploy Supabase Edge Functions (retry transient registry/network errors)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_with_retry() {
            local function_name="$1"
            local attempt
            for attempt in 1 2 3 4; do
              echo "Deploying $function_name (attempt $attempt/4)"
              if supabase functions deploy "$function_name" --project-ref uxsndyiyqttnrdeanhli --no-verify-jwt; then
                return 0
              fi
              if [ "$attempt" -lt 4 ]; then
                sleep $((attempt * 15))
              fi
            done
            echo "::error::Deployment of $function_name failed after 4 attempts."
            return 1
          }
          deploy_with_retry send-push-notification
          deploy_with_retry send-job-reminders
          deploy_with_retry contract-scheduling-assistant
          deploy_with_retry business-assistant
          deploy_with_retry customer-communications
