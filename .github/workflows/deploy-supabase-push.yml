name: Deploy Supabase push function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/send-push-notification/**",
      - "supabase/functions/send-job-reminders/**"
      - ".github/workflows/deploy-supabase-push.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy push notification function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add a GitHub Actions repository secret named SUPABASE_ACCESS_TOKEN. Create the token in Supabase Account Settings > Access Tokens."
            exit 1
          fi
          supabase functions deploy send-push-notification --project-ref uxsndyiyqttnrdeanhli
          supabase functions deploy send-job-reminders --project-ref uxsndyiyqttnrdeanhli
