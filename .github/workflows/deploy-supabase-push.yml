name: Deploy Supabase push function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/send-push-notification/**"
      - "supabase/functions/send-job-reminders/**"
      - ".github/workflows/deploy-supabase-push.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the GitHub repository secret SUPABASE_ACCESS_TOKEN from Supabase Account Settings > Access Tokens."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Add the GitHub repository secret SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi

      - name: Configure reminder caller secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REMINDER_CRON_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          supabase secrets set "REMINDER_CRON_SECRET=$REMINDER_CRON_SECRET" --project-ref uxsndyiyqttnrdeanhli

      - name: Deploy push notification function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy send-push-notification --project-ref uxsndyiyqttnrdeanhli --no-verify-jwt
          supabase functions deploy send-job-reminders --project-ref uxsndyiyqttnrdeanhli --no-verify-jwt
