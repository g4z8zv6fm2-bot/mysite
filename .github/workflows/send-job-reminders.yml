name: Send one-hour job reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/send-job-reminders.yml"

permissions:
  contents: read

concurrency:
  group: one-hour-job-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check reminder service configuration
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Add the GitHub repository secret SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi

      - name: Check upcoming jobs and send reminders
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 \
            --request POST \
            --url "https://uxsndyiyqttnrdeanhli.supabase.co/functions/v1/send-push-notification" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "x-cron-secret: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}'
