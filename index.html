<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101d32">
<meta name="description" content="Legendary Cleaners job scheduling, customer management, maps and revenue tracker.">
<link rel="manifest" href="manifest.webmanifest">
<title>Legendary Cleaners CRM</title>
<style>
:root{--navy:#101d32;--blue:#3977db;--gold:#e8b64b;--bg:#f3f6fa;--card:#fff;--ink:#172235;--muted:#68768a;--line:#e1e7ef;--green:#198754}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:88px}
header{background:var(--navy);color:white;padding:20px 18px 24px;position:sticky;top:0;z-index:3;box-shadow:0 4px 16px #0d1b2b18}
.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:25px;font-weight:900}.brand strong{letter-spacing:.04em;font-size:15px}.brand small{display:block;color:#c3d1e3;font-size:10px;letter-spacing:.12em;margin-top:3px}
header h1{font-size:25px;margin:19px 0 4px}header p{color:#c3d1e3;margin:0;font-size:13px}
main{max-width:760px;margin:auto;padding:16px 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #17223505}.metric small{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:27px;margin:8px 0 4px}.metric span{font-size:11px;color:var(--muted)}h2{font-size:18px;margin:8px 0 13px}h3{font-size:15px;margin:0 0 6px}.muted{color:var(--muted);font-size:13px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 2px 10px}.topline h2{margin:0}
button,.button{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:11px 14px;font:600 13px system-ui;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.secondary{background:#edf2fa;color:#243751}.danger{background:#fff0f0;color:#a12626}.small{padding:8px 10px;font-size:12px}.full{width:100%}
label{display:block;font-size:12px;font-weight:650;margin:10px 0 5px;color:#35445a}input,select,textarea{width:100%;border:1px solid #d7dfeb;border-radius:10px;padding:11px 12px;font:14px system-ui;background:white;color:var(--ink)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.job{display:flex;gap:12px;align-items:flex-start}.time{background:#edf2fa;border-radius:11px;padding:10px 8px;min-width:68px;text-align:center;font-size:12px;font-weight:700}.jobbody{flex:1;min-width:0}.jobbody p{margin:5px 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#e8f5ee;color:#176d43;font-size:11px;font-weight:700}.pill.scheduled{background:#eaf1ff;color:#285bb2}.empty{padding:22px;text-align:center;color:var(--muted)}.hidden{display:none!important}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 3px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px #10213a0b}nav button{background:transparent;color:#68768a;border-radius:12px;flex:1;display:flex;flex-direction:column;gap:4px;padding:7px 1px;font-size:10px;font-weight:600}nav button.active{background:#edf3ff;color:var(--blue)}nav .ico{font-size:19px;line-height:20px}
.notice{background:#fff8e7;border:1px solid #f2dfad;border-radius:12px;padding:12px;font-size:12px;color:#70551b;line-height:1.45}.toolbar{display:flex;gap:8px;align-items:center}.toolbar input{flex:1}.revenuebig{background:var(--navy);color:white;border-radius:17px;padding:20px}.revenuebig small{color:#c3d1e3}.revenuebig strong{display:block;font-size:32px;margin:8px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
@media(min-width:650px){main{padding:22px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}header{padding-left:max(22px,calc((100vw - 720px)/2));padding-right:max(22px,calc((100vw - 720px)/2))}}
</style>
</head>
<body>
<div id="authScreen"></div>
<div id="appShell" class="hidden">
<header><div class="brand"><div class="logo">✦</div><div><strong>LEGENDARY CLEANERS</strong><small>BUSINESS COMMAND CENTER</small></div></div><h1 id="welcome">Your business at a glance.</h1><p id="todayLabel"></p></header>
<main id="app"></main>
<nav id="nav">
<button data-tab="home" class="active"><span class="ico">⌂</span>Home</button>
<button data-tab="schedule"><span class="ico">▦</span>Schedule</button>
<button data-tab="customers"><span class="ico">♙</span>Customers</button>
<button data-tab="team"><span class="ico">♧</span>Team</button>
<button data-tab="revenue"><span class="ico">＄</span>Revenue</button>
</nav>
<div id="accountBar" style="position:fixed;right:10px;top:10px;z-index:8;display:none"><button class="secondary small" onclick="signOutUser()">Sign out</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
const $=s=>document.querySelector(s);
let currentUser=null, authMode="login", supabaseClient=null;
const getDbKey=()=>`legendaryCRM_user_${currentUser?.id||"signed-out"}`;
function localMode(){return !(window.LC_SUPABASE_URL&&window.LC_SUPABASE_ANON_KEY&&!String(window.LC_SUPABASE_URL).includes('YOUR_')&&!String(window.LC_SUPABASE_ANON_KEY).includes('YOUR_'))}
async function passwordDigest(password){
 const bytes=new TextEncoder().encode(password);
 if(window.crypto&&crypto.subtle){const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('')}
 // Compatibility fallback for local preview only; configure Supabase for production use.
 let h=2166136261;for(const b of bytes){h^=b;h=Math.imul(h,16777619)}return 'fallback-'+(h>>>0).toString(16)
}
function showAuth(message="") {
 const root=$('#authScreen');root.style.display='block';$('#appShell').classList.add('hidden');$('#accountBar').style.display='none';
 const local=localMode();
 root.innerHTML=`<main><div class="card" style="margin-top:7vh"><div class="brand"><div class="logo">✦</div><div><strong>LEGENDARY CLEANERS</strong><small>BUSINESS COMMAND CENTER</small></div></div><h2 style="margin-top:22px">${authMode==='signup'?'Create your employee account':'Sign in to your account'}</h2><p class="muted">Use your own email and password. Passwords are not displayed in the app.</p>${message?`<p class="notice" role="status">${escapeHtml(message)}</p>`:''}${local?'<p class="notice">Local preview mode: accounts and CRM records stay in this browser on this device. For real multi-device security, configure Supabase using the README.</p>':''}<form id="authForm"><label>Email address</label><input name="email" type="email" autocomplete="email" required placeholder="you@example.com"><label>Password</label><input name="password" type="password" autocomplete="${authMode==='signup'?'new-password':'current-password'}" minlength="8" required placeholder="At least 8 characters">${authMode==='signup'?'<label>Full name</label><input name="fullName" autocomplete="name" maxlength="80" required placeholder="Your full name">':''}<button class="full" style="margin-top:16px" type="submit">${authMode==='signup'?'Create account':'Sign in'}</button></form><button class="secondary full" style="margin-top:10px" onclick="toggleAuthMode()">${authMode==='signup'?'Already have an account? Sign in':'New employee? Create an account'}</button>${local?'':'<button class="secondary full" style="margin-top:8px" onclick="resetPassword()">Forgot password?</button>'}</div></main>`;
 $('#authForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')||'').trim().toLowerCase(),password=String(f.get('password')||''),fullName=String(f.get('fullName')||'').trim();const submit=e.target.querySelector('button[type=submit]');submit.disabled=true;submit.textContent='Please wait...';
 try{
  if(local){const key='lc_local_accounts_v1';let accounts=[];try{accounts=JSON.parse(localStorage.getItem(key)||'[]')}catch(_){};
   if(authMode==='signup'){if(accounts.some(a=>a.email===email))throw new Error('An account with this email already exists. Sign in instead.');const account={id:'local-'+(await passwordDigest(email)).slice(0,20),email,passwordHash:await passwordDigest(password),fullName,createdAt:new Date().toISOString()};accounts.push(account);localStorage.setItem(key,JSON.stringify(accounts));await activateUser({id:account.id,email,user_metadata:{full_name:fullName},localAccount:true});}
   else{const account=accounts.find(a=>a.email===email);if(!account||account.passwordHash!==await passwordDigest(password))throw new Error('Email or password is incorrect.');await activateUser({id:account.id,email,user_metadata:{full_name:account.fullName},localAccount:true});}
  }else if(authMode==='signup'){const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:fullName}}});if(error)throw error;if(data.session){await activateUser(data.user)}else showAuth('Account created. Check your email for a verification link, then return here to sign in.');}
  else{const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;await activateUser(data.user)}
 }catch(err){showAuth(err.message||'Sign-in failed. Check your details and try again.')}};
}
function toggleAuthMode(){authMode=authMode==='login'?'signup':'login';showAuth()}
async function resetPassword(){if(localMode()){alert('Password reset is available after connecting Supabase. In local preview mode, create a new account if you forget your password.');return}const email=prompt('Enter the email address for your account:');if(!email)return;try{const {error}=await supabaseClient.auth.resetPasswordForEmail(email.trim().toLowerCase(),{redirectTo:location.origin+location.pathname});if(error)throw error;showAuth('If an account exists for that email, a password reset link has been sent.')}catch(e){showAuth(e.message||'Could not send password reset email.')}}
function normalizeDb(){if(!db||typeof db!=='object')db={jobs:[],customers:[],team:[],tab:'home'};if(!Array.isArray(db.jobs))db.jobs=[];if(!Array.isArray(db.customers))db.customers=[];if(!Array.isArray(db.team))db.team=[];db.team=db.team.map((m,i)=>typeof m==='string'?{id:'employee-'+i,name:m,role:i===0?'Owner':'Cleaner',phone:'',email:''}:m);if(!db.team.length)db.team=[{id:'owner',name:'Owner',role:'Owner',phone:'',email:''}];if(!db.team.some(m=>m.name==='Owner'&&m.role==='Owner'))db.team.unshift({id:'owner',name:'Owner',role:'Owner',phone:'',email:''});}
async function activateUser(user){currentUser=user;try{db=JSON.parse(localStorage.getItem(getDbKey())||'null')}catch(e){db=null}normalizeDb();save();$("#authScreen").style.display='none';$("#appShell").classList.remove('hidden');$("#accountBar").style.display='block';$('#welcome').textContent='Welcome'+(user.user_metadata?.full_name?' '+user.user_metadata.full_name:'')+'.';render();checkUpcomingJobReminders()}
async function signOutUser(){if(supabaseClient)await supabaseClient.auth.signOut();currentUser=null;authMode='login';showAuth('You have been signed out.')}
async function initAuth(){const url=window.LC_SUPABASE_URL,key=window.LC_SUPABASE_ANON_KEY;if(!url||!key||String(url).includes('YOUR_')||String(key).includes('YOUR_')){showAuth();return}if(!window.supabase){showAuth('Authentication library did not load. Check your internet connection and reload.');return}supabaseClient=window.supabase.createClient(url,key);const {data:{session}}=await supabaseClient.auth.getSession();if(session?.user){await activateUser(session.user)}else showAuth();supabaseClient.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_IN'&&session?.user&&currentUser?.id!==session.user.id)await activateUser(session.user);if(event==='SIGNED_OUT'&&currentUser){currentUser=null;showAuth('You have been signed out.')}})}

const isoToday=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmtMoney=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(Number(n)||0);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db={jobs:[],customers:[],team:[],tab:'home'};
let tab='home',scheduleFilter='all',revPeriod='week',search='';
function save(){if(currentUser)localStorage.setItem(getDbKey(),JSON.stringify(db))}
function setTab(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('#welcome').textContent=({home:'Your business at a glance.',schedule:'Manage your jobs.',customers:'Your customer book.',team:'Your team.',revenue:'Track every dollar.'})[t];render()}
function maps(address){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address)}
function jobCard(j){return `<article class="card"><div class="job"><div class="time">${escapeHtml(j.time||'No time')}<br><small>${escapeHtml(j.date||'')}</small></div><div class="jobbody"><h3>${escapeHtml(j.name)}</h3><p>⌖ ${escapeHtml(j.address)}</p><p>Assigned: ${escapeHtml(j.assignee||'Owner')} · <b>${fmtMoney(j.price)}</b></p><span class="pill ${j.status==='Completed'?'':'scheduled'}">${escapeHtml(j.status)}</span></div></div><div class="actions"><a class="button secondary small" href="${maps(j.address)}" target="_blank" rel="noopener">⌖ Directions</a>${j.status!=='Completed'?`<button class="small" onclick="completeJob('${j.id}')">Mark complete</button>`:''}<button class="small secondary" onclick="editJob('${j.id}')">Edit</button><button class="small danger" onclick="deleteJob('${j.id}')">Delete</button></div></article>`}
function render(){
 const app=$('#app'),today=isoToday(),weekStart=new Date();weekStart.setDate(weekStart.getDate()-6);const weekISO=weekStart.toISOString().slice(0,10);
 const todays=db.jobs.filter(j=>j.date===today),doneToday=todays.filter(j=>j.status==='Completed').reduce((s,j)=>s+(+j.price||0),0),doneWeek=db.jobs.filter(j=>j.date>=weekISO&&j.date<=today&&j.status==='Completed').reduce((s,j)=>s+(+j.price||0),0);
 if(tab==='home'){
 const next=db.jobs.filter(j=>j.status!=='Completed'&&j.date>=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4);
 app.innerHTML=`<div class="grid"><div class="card metric"><small>Today's revenue</small><strong>${fmtMoney(doneToday)}</strong><span>Completed jobs only</span></div><div class="card metric"><small>This week's revenue</small><strong>${fmtMoney(doneWeek)}</strong><span>Last 7 days</span></div><div class="card metric"><small>Today's jobs</small><strong>${todays.length}</strong><span>Scheduled & completed</span></div><div class="card metric"><small>Customers</small><strong>${db.customers.length}</strong><span>Saved contacts</span></div></div><div class="topline"><h2>Upcoming jobs</h2><button onclick="setTab('schedule')">+ Add job</button></div>${next.length?next.map(jobCard).join(''):'<div class="card empty">No upcoming jobs yet.<br><br><button onclick="newJob()">Schedule your first job</button></div>'}<div class="notice">Your records are saved on this device under your signed-in account. They do not sync to other devices yet.</div>`;
 }else if(tab==='schedule'){
 let list=db.jobs.filter(j=>(scheduleFilter==='all'||(scheduleFilter==='today'?j.date===today:scheduleFilter==='upcoming'?j.status!=='Completed'&&j.date>=today:j.status==='Completed'))&&(search===''||(j.name+' '+j.address).toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 app.innerHTML=`<div class="topline"><h2>Job schedule</h2><button onclick="newJob()">+ Add job</button></div><div class="toolbar"><input id="jobSearch" placeholder="Search customer or address" value="${escapeHtml(search)}" oninput="search=this.value;render()"></div><div class="toolbar" style="margin:10px 0"><select onchange="scheduleFilter=this.value;render()"><option value="all" ${scheduleFilter==='all'?'selected':''}>All jobs</option><option value="today" ${scheduleFilter==='today'?'selected':''}>Today</option><option value="upcoming" ${scheduleFilter==='upcoming'?'selected':''}>Upcoming</option><option value="completed" ${scheduleFilter==='completed'?'selected':''}>Completed</option></select></div>${list.length?list.map(jobCard).join(''):'<div class="card empty">No jobs found. Add your first job above.</div>'}`;
 }else if(tab==='customers'){
 let list=db.customers.filter(c=>(c.name+' '+c.address+' '+c.phone).toLowerCase().includes(search.toLowerCase()));
 app.innerHTML=`<div class="topline"><h2>Customers</h2><button onclick="customerForm()">+ Add customer</button></div><input placeholder="Search customers..." value="${escapeHtml(search)}" oninput="search=this.value;render()">${list.length?list.map(c=>`<div class="card"><h3>${escapeHtml(c.name)}</h3><p class="muted">${escapeHtml(c.phone||'No phone')}<br>⌖ ${escapeHtml(c.address||'No address')}</p><div class="actions"><a class="button secondary small" target="_blank" rel="noopener" href="${maps(c.address)}">Directions</a><button class="small" onclick="newJobFor('${c.id}')">Schedule job</button><button class="small danger" onclick="deleteCustomer('${c.id}')">Delete</button></div></div>`).join(''):'<div class="card empty">No customers saved yet. Add a customer to get started.</div>'}`;
 }else if(tab==='team'){
 app.innerHTML=`<div class="topline"><h2>Team members</h2><button onclick="employeeForm()">+ Add employee</button></div><div class="grid"><div class="card metric"><small>Total team</small><strong>${db.team.length}</strong><span>Employees saved on this device</span></div><div class="card metric"><small>Cleaners</small><strong>${db.team.filter(m=>m.role==='Cleaner').length}</strong><span>Cleaning team members</span></div></div><div class="card"><h3>Employee directory</h3>${db.team.map(m=>`<div class="row"><div style="min-width:0;flex:1"><b>♙ ${escapeHtml(m.name)}</b><div class="muted">${escapeHtml(m.role||'Employee')}${m.phone?' · '+escapeHtml(m.phone):''}${m.email?'<br>'+escapeHtml(m.email):''}</div></div><div class="actions" style="margin:0"><button class="small secondary" onclick="editEmployee('${m.id}')">Edit</button>${m.role!=='Owner'?`<button class="small danger" onclick="deleteEmployee('${m.id}')">Remove</button>`:''}</div></div>`).join('')}</div><div class="notice">Employee records are saved on this device. ${renderJobReminderSettings()} Adding an employee here also makes their name available in the job assignment dropdown. This does not create a separate login for them.</div>`;
 }else if(tab==='revenue'){
 let start=new Date();if(revPeriod==='week')start.setDate(start.getDate()-6);else if(revPeriod==='month')start.setDate(1);let startISO=revPeriod==='all'?'0000-01-01':start.toISOString().slice(0,10);
 let done=db.jobs.filter(j=>j.status==='Completed'&&j.date>=startISO&&j.date<=today),total=done.reduce((s,j)=>s+(+j.price||0),0);
 app.innerHTML=`<h2>Revenue dashboard</h2><div class="toolbar"><select onchange="revPeriod=this.value;render()"><option value="day" ${revPeriod==='day'?'selected':''}>Today</option><option value="week" ${revPeriod==='week'?'selected':''}>Last 7 days</option><option value="month" ${revPeriod==='month'?'selected':''}>This month</option><option value="all" ${revPeriod==='all'?'selected':''}>All time</option></select></div><div class="revenuebig" style="margin:12px 0"><small>Revenue from completed jobs</small><strong>${fmtMoney(total)}</strong><small>${done.length} completed job${done.length===1?'':'s'}</small></div><div class="card"><h3>Completed jobs</h3>${done.length?done.map(j=>`<div class="row"><div><b>${escapeHtml(j.name)}</b><div class="muted">${escapeHtml(j.date)} · ${escapeHtml(j.address)}</div></div><b>${fmtMoney(j.price)}</b></div>`).join(''):'<p class="muted">No completed jobs in this period yet.</p>'}</div><div class="notice">Revenue is based on job prices marked completed. This is gross revenue, not profit after expenses or taxes.</div>`;
 }
}

function employeeForm(existing={}){
 $('#app').innerHTML=`<div class="topline"><h2>${existing.id?'Edit employee':'Add employee'}</h2><button class="secondary" onclick="setTab('team')">Cancel</button></div><form class="card" id="employeeForm"><label>Full name</label><input name="name" required maxlength="80" value="${escapeHtml(existing.name||'')}" placeholder="Employee name"><label>Role</label><select name="role"><option ${(!existing.role||existing.role==='Cleaner')?'selected':''}>Cleaner</option><option ${existing.role==='Team Lead'?'selected':''}>Team Lead</option><option ${existing.role==='Office / Admin'?'selected':''}>Office / Admin</option><option ${existing.role==='Owner'?'selected':''}>Owner</option><option ${existing.role==='Other'?'selected':''}>Other</option></select><label>Phone number (optional)</label><input name="phone" type="tel" value="${escapeHtml(existing.phone||'')}" placeholder="(555) 555-0123"><label>Email (optional)</label><input name="email" type="email" value="${escapeHtml(existing.email||'')}" placeholder="employee@example.com"><button class="full" style="margin-top:16px" type="submit">${existing.id?'Save changes':'Add employee'}</button></form>`;
 $('#employeeForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(existing.id){db.team=db.team.map(m=>m.id===existing.id?{...m,...data}:m)}else{db.team.push({id:crypto.randomUUID(),...data})}save();setTab('team')};
}
function editEmployee(id){const m=db.team.find(m=>m.id===id);if(m&&m.role!=='Owner')employeeForm(m);else if(m)employeeForm(m)}
function deleteEmployee(id){const m=db.team.find(m=>m.id===id);if(!m||m.role==='Owner')return;if(!confirm(`Remove ${m.name} from the team? Existing jobs assigned to this name will keep their assignment text.`))return;db.team=db.team.filter(m=>m.id!==id);save();render()}

// Upcoming-job reminders: checks scheduled jobs every 60 seconds while the app is open.
function requestJobNotificationPermission(){
 if(!('Notification' in window)){alert('This browser does not support desktop notifications.');return}
 Notification.requestPermission().then(p=>{if(p==='granted'){localStorage.setItem('lc_job_notifications','on');alert('Job reminders are enabled. Keep the app open to receive reminders.')}else{alert('Notifications were not enabled. You can allow them in your browser site settings.')}});
}
function checkUpcomingJobReminders(){
 if(!('Notification' in window)||Notification.permission!=='granted'||localStorage.getItem('lc_job_notifications')==='off')return;
 const now=Date.now(), windowEnd=now+60*60*1000;
 (db.jobs||[]).forEach(j=>{
   const raw=j.datetime||j.scheduledAt||((j.date||j.scheduledDate)&&(j.time||j.startTime)?`${j.date||j.scheduledDate}T${j.time||j.startTime}`:(j.date||j.scheduledDate));
   if(!raw)return;
   const dt=new Date(raw);
   if(Number.isNaN(dt.getTime()))return;
   if(dt.getTime()>=windowEnd-60*1000&&dt.getTime()<windowEnd){
     const key='lc_job_reminded_'+(j.id||j.jobId||raw);
     if(localStorage.getItem(key))return;
     localStorage.setItem(key,'1');
     const customer=j.customerName||j.customer||j.name||'Scheduled job';
     const title=j.title||j.service||'Cleaning appointment';
     new Notification('Job coming up in 1 hour',{body:customer+' — '+title,tag:key});
   }
 });
}
function renderJobReminderSettings(){
 return `<div class="card"><h3>Job reminders</h3><p class="muted">Get a browser notification about a scheduled job approximately one hour before it starts.</p><div class="row"><span>Browser permission</span><b>${('Notification' in window)?Notification.permission:'Not supported'}</b></div><button onclick="requestJobNotificationPermission()">Enable job notifications</button><p class="muted" style="margin-top:10px">Reminders run while this app is open. Your browser must allow notifications.</p></div>`;
}
setInterval(checkUpcomingJobReminders,60000);

function newJob(existing={}){const customers=db.customers;$('#app').innerHTML=`<div class="topline"><h2>${existing.id?'Edit job':'New job'}</h2><button class="secondary" onclick="setTab('schedule')">Cancel</button></div><form class="card" id="jobForm"><label>Customer / job name</label><input name="name" required value="${escapeHtml(existing.name||'')}" placeholder="Customer name"><label>House address</label><input name="address" required value="${escapeHtml(existing.address||'')}" placeholder="Street, city, ZIP"><div class="formgrid"><div><label>Date</label><input name="date" type="date" required value="${escapeHtml(existing.date||isoToday())}"></div><div><label>Start time</label><input name="time" type="time" required value="${escapeHtml(existing.time||'09:00')}"></div></div><div class="formgrid"><div><label>Job price ($)</label><input name="price" type="number" min="0" step=".01" required value="${escapeHtml(existing.price??150)}"></div><div><label>Assigned to</label><select name="assignee">${db.team.map(m=>`<option value="${escapeHtml(m.name)}" ${m.name===(existing.assignee||'Owner')?'selected':''}>${escapeHtml(m.name)}</option>`).join('')}</select></div></div><label>Status</label><select name="status"><option ${!existing.status||existing.status==='Scheduled'?'selected':''}>Scheduled</option><option ${existing.status==='Completed'?'selected':''}>Completed</option></select><button class="full" style="margin-top:16px" type="submit">Save job</button></form>`;
 $('#jobForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),data=Object.fromEntries(f.entries());data.price=Number(data.price);if(existing.id){db.jobs=db.jobs.map(j=>j.id===existing.id?{...j,...data}:j)}else db.jobs.push({id:crypto.randomUUID(),...data});save();setTab('schedule')}}
function editJob(id){let j=db.jobs.find(j=>j.id===id);if(j)newJob(j)}
